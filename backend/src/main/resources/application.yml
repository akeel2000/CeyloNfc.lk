spring:
  application:
    name: nfc-platform-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:nfc_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:nfc_app}
    password: ${DB_PASSWORD:nfc_app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce's own default command timeout is 60s - fine for a healthy connection, but
      # RateLimiterService's in-memory fallback is only useful if a dead Redis fails fast. Left
      # at the Lettuce default, every rate-limited request (including the NFC/QR tap redirect
      # hot path) would hang for a full minute per request during a Redis outage before
      # falling back - worse than not having a fallback at all. Redis is a local, low-latency
      # dependency here, so both timeouts stay generous relative to real-world round trips
      # while still failing fast enough that the fallback is actually protective.
      timeout: 500ms
      connect-timeout: 500ms
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000}
    cookie-domain: ${APP_COOKIE_DOMAIN:}
  security:
    nfc-token-pepper: ${NFC_TOKEN_PEPPER:dev-only-pepper-change-me}
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 15
  storage:
    type: ${STORAGE_TYPE:local}
    path: ${STORAGE_PATH:./media}
    s3-bucket: ${STORAGE_S3_BUCKET:}
    s3-region: ${STORAGE_S3_REGION:us-east-1}
    s3-endpoint: ${STORAGE_S3_ENDPOINT:}
    s3-access-key: ${STORAGE_S3_ACCESS_KEY:}
    s3-secret-key: ${STORAGE_S3_SECRET_KEY:}
    s3-public-url: ${STORAGE_S3_PUBLIC_URL:}
  mail:
    from: ${MAIL_FROM:no-reply@ceylonfc.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.nfcplatform: INFO
