name: nfc-platform

services:
  mysql:
    image: mysql:8.4
    container_name: nfc-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nfc_platform}
      MYSQL_USER: ${DB_USERNAME:-nfc_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nfc_app_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-nfc_root_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-nfc_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nfc-network

  redis:
    image: redis:7-alpine
    container_name: nfc-platform-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nfc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nfc-platform-backend
    restart: unless-stopped
    environment:
      # `docker` is intentionally the local, HTTP-only profile. Set
      # SPRING_PROFILES_ACTIVE=prod in the production .env so secure cookies and the
      # production-only API settings are enabled.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-nfc_platform}
      DB_USERNAME: ${DB_USERNAME:-nfc_app}
      DB_PASSWORD: ${DB_PASSWORD:-nfc_app_password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-32b}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-2592000000}
      NFC_TOKEN_PEPPER: ${NFC_TOKEN_PEPPER:-dev-only-pepper-change-me}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://localhost:8080}
      APP_COOKIE_DOMAIN: ${APP_COOKIE_DOMAIN:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: /app/media
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Optional, first-boot only: seeds the initial Super Admin if both are set.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - backend-media:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nfc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are embedded in the browser bundle by `next build`,
        # so this must be a build argument as well as a runtime environment value.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: nfc-platform-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nfc-network

networks:
  nfc-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  backend-media:
